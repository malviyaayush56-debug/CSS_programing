<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative unit percentage</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
#first{
    height: 50px;
    width: 200px;
    background-color: blue;
}
#second{
    height: 60%;
    width: 50%;
    background-color: red;
}
    </style>
</head>
<body>
    <div id="first">first div
    <div id="second">second div</div>
</body>
</html>
