<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Direction</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.box{
    height: 100px;
    width: 100px;
    border: 3px solid black;
    margin: 5px;
}
#Heading{
    margin-left: 200px;
}
 #container{
    height: 600px;
    width: 600px;
    padding: 10px;
    margin: 20px;
    border: 3px solid black;

 display: flex;
 flex-wrap: wrap;
 
 justify-content: center;
align-items: start;
align-content: center;
 }   
 #box1{background-color: red;}
 #box3{background-color: blue;}
 #box2{background-color: yellow;}
 #box4{background-color: blueviolet;}

 

    </style>
</head>
<body>
    <h1 id="Heading">Flat Container</h1>
    <div id="container">
<div id="box1" class="box">Flex Item 1</div>
<div id="box2" class="box">Flex Item 2</div>
<div id="box3" class="box">Flex Item 3</div>
<div id="box4" class="box">Flex Item 4</div>



    </div>
</body>
</html>
