<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transform</title>
    <style>
.box{
    background-color: rgb(159, 111, 203);
    height: 50px;
    width: 50px;
    border: 2px solid black;
    border-radius: 5px;
    position: relative;
    top: 50px;
    left: 50px;
   
    transition: all 0.5sec ease-in;
}
.box:hover{
    transform: rotate(45deg);
}
    </style>
</head>
<body>
    <div class="box">rotate</div>
</body>
</html>
