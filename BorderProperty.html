<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .pad{
            height: 50px;
            width: 50px;
            padding: 2px;
            margin: 5px;
             box-sizing: border-box;
        }
        #first{
            border: 2px solid;
            box-sizing: content-box;
            border-radius: 9px;
            margin: 5px 5px 5px 5px;
            background-color: aqua;
        }
        #second{
border: 3px dotted red;

            margin: 5px 5px 5px 5px;
            background-color: rgb(70, 160, 199);
        }
    </style>
</head>
<body>
    <div id="first" class="pad">Padding checker</div>
    <div id="second" class="pad">Padding checker</div>
</body>
</html>
