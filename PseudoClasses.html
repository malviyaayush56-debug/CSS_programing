<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>pseudo classes</title>
    <style>
        .pseudo{
            height: 25px;
            width: 150px;
            background-color: forestgreen;
            border: 2px solid black;
            border-radius: 10px;

            transition: all is ease-in-out 0s;
        }
        .pseudo:hover{
            background-color: rgb(227, 43, 14);
              height: 30px;
            width: 160px;
        }
        .pseudo:active{
            height: 25px;
            width: 150px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <button class="pseudo">Lerning pseudo
    </button>
</body>
</html>
